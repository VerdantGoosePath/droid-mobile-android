name: Update cryptography lockfile

# One-time dependency bootstrap; remove this workflow after use.
on:
  push:
    branches: [feat/factory-relay-remote-control]
    paths: [.github/workflows/crypto-lockfile.yml]

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve audited libsodium dependency and commit lockfile
        run: |
          set -euo pipefail
          npm install --save-exact libsodium-wrappers@0.8.4 --workspace @droidmobile/daemon-client --package-lock=true --ignore-scripts
          git config user.name "droid-mobile[bot]"
          git config user.email "droid-mobile[bot]@users.noreply.github.com"
          git add package-lock.json packages/daemon-client/package.json
          git diff --cached --quiet || git commit -m "build(crypto): add pinned libsodium wrappers and lockfile"
          git push origin HEAD:feat/factory-relay-remote-control
