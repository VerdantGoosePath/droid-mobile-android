name: Compose CI & installable APK
on:
  push:
    branches: [main, feat/compose-expressive-native]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install npm workspace packages
        run: npm install --no-audit --no-fund
      - name: Typecheck native bridge
        run: npm run typecheck -w @droidmobile/native-bridge
      - name: Build SDK host assets
        run: npm run build -w @droidmobile/native-bridge
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DROID_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.DROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/droid-signing"
          mkdir -p "$directory"
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$directory/release.jks"
          else
            STORE_PASSWORD="$(openssl rand -hex 16)"
            KEY_PASSWORD="$STORE_PASSWORD"
            KEY_ALIAS=ci-ephemeral
            keytool -genkeypair -noprompt -keyalg RSA -keysize 3072 \
              -validity 30 -alias "$KEY_ALIAS" -keystore "$directory/release.jks" \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname 'CN=Droid Mobile Compose CI, O=Testing, C=GB'
            echo 'WARNING: ephemeral signing certificate, not stable across runs'
          fi
          {
            echo 'storeFile=release.jks'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > "$directory/keystore.properties"
          chmod 600 "$directory/"*
          echo "DROID_KEYSTORE_PROPERTIES=$directory/keystore.properties" >> "$GITHUB_ENV"
      - name: Assemble Compose release
        working-directory: apps/mobile/android
        run: bash ./gradlew --no-daemon assembleRelease
      - name: Verify installable APK
        shell: bash
        run: |
          set -euo pipefail
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$apksigner_bin" verify --verbose "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: droid-mobile-compose-apk-${{ github.run_number }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error
