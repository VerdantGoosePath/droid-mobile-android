plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def signingFile = System.getenv('DROID_KEYSTORE_PROPERTIES') ?
    new File(System.getenv('DROID_KEYSTORE_PROPERTIES')) :
    rootProject.file('../../../secrets/keystore.properties')
def signing = new Properties()
if (signingFile.isFile()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'com.droidmobile.client'
    compileSdk 36
    defaultConfig {
        applicationId 'com.droidmobile.client'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '2.0.0-native-alpha'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { compose true; buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    signingConfigs {
        release {
            if (signingFile.isFile()) {
                storeFile new File(signingFile.parentFile, signing['storeFile'] as String)
                storePassword signing['storePassword'] as String
                keyAlias signing['keyAlias'] as String
                keyPassword signing['keyPassword'] as String
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug { applicationIdSuffix '.dev' }
    }
    packaging { resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] } }
}
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name in ['assembleRelease','bundleRelease','packageRelease'] }
        && !signingFile.isFile()) {
        throw new GradleException("Release signing config missing: ${signingFile}")
    }
}
dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3:1.5.0-rc01'
    implementation 'androidx.compose.material3:material3-adaptive-navigation-suite:1.4.0'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.10.2'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.12.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.12.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.12.0'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.webkit:webkit:1.17.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
